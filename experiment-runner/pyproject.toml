[project]
name = "research-paper-experiment-runner"
version = "0.1.0"
description = "Lightweight experiment runner for ThruWire vs chat harness comparisons"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
  "playwright>=1.52.0",
  "python-dotenv>=1.0.1",
  "selenium>=4.31.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["experiment_runner"]
